services:
  trilium:
    image:  triliumnext/trilium:latest
    container_name: trilium
    restart: unless-stopped
    ports:
      - "8383:8080"
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./data:/home/node/trilium-data
    networks:
      - shared-net

networks:
  shared-net:
    external: true