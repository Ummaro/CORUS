services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:latest
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'Europe/Paris'
    volumes:
      - /mnt/storage/Docker/wallos/db:/var/www/html/db
      - /mnt/storage/Docker/wallos/logos:/var/www/html/images/uploads/logos
      - './patches/get_ical_feed.php:/var/www/html/api/subscriptions/get_ical_feed.php'
    restart: unless-stopped
    networks:
      - shared-net

networks:
  shared-net:
    external: true