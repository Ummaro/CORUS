- Calendar:
    - Calendar:
        widget:
            type: calendar
            showTime: true
            timezone: Europe/Paris
            view: monthly
            integrations:
            - type: radarr
              service_group: Media
              service_name: Radarr
              baseUrl: http://radarr:7878
            - type: sonarr
              service_group: Media
              service_name: Sonarr
              baseUrl: http://sonarr:8989
            - type: ical
              url: https://calendar.google.com/calendar/ical/jdamas.2624%40gmail.com/private-b95ae89c233e91f4cba401cd5de22993/basic.ics
              name: Personal
            - type: ical
              url: "{{HOMEPAGE_VAR_WALLOS_ICAL_URL}}"
              name: Wallos
              color: sky

    - Release:
        widget:
            type: calendar
            showTime: true
            timezone: Europe/Paris
            view: agenda
            previousDays: 30
            integrations:
            - type: radarr
              service_group: Media
              service_name: Radarr
              baseUrl: http://radarr:7878
            - type: sonarr
              service_group: Media
              service_name: Sonarr
              baseUrl: http://sonarr:8989

    - Events:
        widget:
            type: calendar
            showTime: true
            timezone: Europe/Paris
            view: agenda
            previousDays: 0
            maxEvents: 5
            integrations:
            - type: ical
              url: https://calendar.google.com/calendar/ical/jdamas.2624%40gmail.com/private-b95ae89c233e91f4cba401cd5de22993/basic.ics
              name: Personal
            - type: ical
              url: "{{HOMEPAGE_VAR_WALLOS_ICAL_URL}}"
              name: Wallos
              color: sky

