version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - 9000:9000   # Interface web
      - 8000:8000   # Port pour agents distants (inutile si local uniquement)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - shared-net

networks:
  shared-net:
    external: true

volumes:
  portainer_data:
