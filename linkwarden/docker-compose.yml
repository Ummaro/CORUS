services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - /home/docker/.env
    environment:
      - DATABASE_URL=postgresql://linkwarden:${LINKWARDEN_POSTGRES_PASSWORD}@postgres:5432/linkwarden
      - NEXTAUTH_SECRET=${LINKWARDEN_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${LINKWARDEN_NEXTAUTH_URL}
    volumes:
      - ./linkwarden_data:/data/data
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - shared-net

  postgres:
    image: postgres:15
    container_name: linkwarden-db
    restart: unless-stopped
    env_file:
      - /home/docker/.env
    environment:
      - POSTGRES_DB=linkwarden
      - POSTGRES_USER=linkwarden
      - POSTGRES_PASSWORD=${LINKWARDEN_POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-net

networks:
  shared-net:
    external: true