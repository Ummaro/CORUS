version: '3'

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /mnt/storage/Docker/nginxproxymanager/data:/data
      - /mnt/storage/Docker/nginxproxymanager/letsencrypt:/etc/letsencrypt
    networks:
      - shared-net

networks:
  shared-net:
    external: true
