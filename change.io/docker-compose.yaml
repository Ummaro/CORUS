services:
  changedetection:
    image: lscr.io/linuxserver/changedetection.io:latest
    container_name: changedetection
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /path/to/changedetection/config:/config
    ports:
      - 5000:5000
    restart: unless-stopped
    networks:
      - shared-net

networks:
  shared-net:
    external: true