version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - /mnt/storage/Docker/uptime-kuma/uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
