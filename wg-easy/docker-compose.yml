version: "3.8"

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      - INIT_ENABLED=1
      - INIT_USERNAME=admin
      - INIT_PASSWORD=${WG_EASY_INIT_PASSWORD}
      - INIT_HOST=${WG_EASY_INIT_HOST}
      - INIT_PORT=51820
      - INIT_DNS=${WG_EASY_INIT_DNS}
      - INIT_IPV4_CIDR=${WG_EASY_INIT_IPV4_CIDR}
      - INIT_IPV6_CIDR=fd00::/64
      - INSECURE=true
    ports:
      - "51821:51821"
      - "51820:51820/udp"
    volumes:
      - ./config:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      - shared-net

networks:
  shared-net:
    external: true
