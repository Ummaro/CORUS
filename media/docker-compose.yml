  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - ./seerr:/app/config
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - shared-net

  qbittorrentvpn:
    image: binhex/arch-qbittorrentvpn
    container_name: qbittorrentvpn
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - VPN_ENABLED=yes
      - VPN_PROV=protonvpn
      - VPN_CLIENT=openvpn
      - VPN_PORT_FORWARDING=yes
      - VPN_PORT_FORWARDING_PROV=protonvpn
      - STRICT_PORT_FORWARD=yes
      - ENABLE_PRIVOXY=no
      - LAN_NETWORK=${MEDIA_LAN_NETWORK}
      - NAME_SERVERS=${MEDIA_NAME_SERVERS}
      - VPN_USER=${MEDIA_VPN_USER}
      - VPN_PASS=${MEDIA_VPN_PASS}
      - WEBUI_PORT=8082
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    volumes:
      - ./qbittorrent:/config
      - /mnt/DAS1:/media
    networks:
      - shared-net

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9696:9696"
      - "8191:8191"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.ovpn
      - OPENVPN_USER=${MEDIA_OPENVPN_USER}
      - OPENVPN_PASSWORD=${MEDIA_OPENVPN_PASSWORD}
      - FIREWALL_INPUT_PORTS=9696,8191
      - TZ=Europe/Paris
    volumes:
      - ./gluetun:/gluetun
    networks:
      - shared-net

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info

  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./prowlarr:/config
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris


  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - ./radarr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    networks:
      - shared-net

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    volumes:
      - ./sonarr:/config
      - /mnt/DAS1:/media
    networks:
      - shared-net


  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - ./bazarr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    networks:
      - shared-net

  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    restart: unless-stopped
    volumes:
      - ./unpackerr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${MEDIA_UN_SONARR_0_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${MEDIA_UN_RADARR_0_API_KEY}
    networks:
      - shared-net

  jellyswarrm:
    image: ghcr.io/llukas22/jellyswarrm:latest
    container_name: jellyswarrm
    restart: unless-stopped
    ports: 
      - "3005:3000"
    volumes:
      - ./jellyswarrm:/app/data
    environment:
      - JELLYSWARRM_USERNAME=admin
      - JELLYSWARRM_PASSWORD=${MEDIA_JELLYSWARRM_PASSWORD}
      - TZ=Europe/Paris
    networks:
      - shared-net

networks:
  shared-net:
    external: true