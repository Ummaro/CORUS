services:
  # jellyfin:
  #   image: jellyfin/jellyfin
  #   container_name: jellyfin
  #   restart: unless-stopped
  #   ports:
  #     - "8096:8096"
  #   volumes:
  #     - ./jellyfin:/config
  #     - /mnt/DAS1:/media
  #   environment:
  #     - TZ=Europe/Paris
  #   networks:
  #     - shared-net

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - /mnt/storage/Docker/media/seerr:/app/config
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - shared-net

  proxy_0:
    image: qmcgaw/gluetun
    container_name: proxy_0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9696:9696"
      - "8191:8191"
      - "8082:8082"
      - "8088:8888"
      - "8585:8080"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - SERVER_COUNTRIES=France
      - OPENVPN_USER=${MEDIA_OPENVPN_USER}
      - OPENVPN_PASSWORD=${MEDIA_OPENVPN_PASSWORD}
      - TZ=Europe/Paris
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - HTTPPROXY=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12,10.0.0.0/24
      - FIREWALL_INPUT_PORTS=9696,8191,8082,8888,8080
    volumes:
      - /mnt/storage/Docker/proxy/proxy_0:/gluetun
      - ../proxy/custom0.ovpn:/gluetun/custom0.ovpn
    networks:
      shared-net:
        aliases:
          - gluetun
          - qbittorrentvpn

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.1
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:proxy_0"
    depends_on:
      proxy_0:
        condition: service_healthy
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
      - WEBUI_PORT=8082
      - QB_PASSWORD=${MEDIA_QB_PASSWORD}
    volumes:
      - /mnt/storage/Docker/media/qbittorrent:/config
      - /mnt/DAS1:/media
      - /mnt/storage/Docker/media/rustatio/torrents:/torrents

  qbittorrent-port-sync:
    image: alpine:3.21
    container_name: qbittorrent-port-sync
    restart: unless-stopped
    network_mode: "service:proxy_0"
    depends_on:
      proxy_0:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - TZ=Europe/Paris
      - QB_USER=admin
      - QB_PASSWORD=${MEDIA_QB_PASSWORD}
      - QB_URL=http://127.0.0.1:8082
      - GLUETUN_URL=http://127.0.0.1:8000/v1/portforward
      - INTERVAL=30
    volumes:
      - ./scripts/qbittorrent-port-sync.sh:/sync.sh:ro
    entrypoint: ["/bin/sh", "/sync.sh"]

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    network_mode: "service:proxy_0"
    depends_on:
      proxy_0:
        condition: service_healthy
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info

  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:proxy_0"
    depends_on:
      proxy_0:
        condition: service_healthy
    volumes:
      - /mnt/storage/Docker/media/prowlarr:/config
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris


  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - /mnt/storage/Docker/media/radarr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    networks:
      - shared-net

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    volumes:
      - /mnt/storage/Docker/media/sonarr:/config
      - /mnt/DAS1:/media
    networks:
      - shared-net


  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - /mnt/storage/Docker/media/bazarr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    networks:
      - shared-net

  unpackerr:
    build:
      context: .
      dockerfile: unpackerr.Dockerfile
    image: unpackerr:local
    container_name: unpackerr
    restart: unless-stopped
    volumes:
      - /mnt/storage/Docker/media/unpackerr:/config
      - /mnt/DAS1:/media
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${MEDIA_UN_SONARR_0_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${MEDIA_UN_RADARR_0_API_KEY}
    networks:
      - shared-net

  jellyswarrm:
    image: ghcr.io/llukas22/jellyswarrm:latest
    container_name: jellyswarrm
    restart: unless-stopped
    ports: 
      - "3005:3000"
    volumes:
      - /mnt/storage/Docker/media/jellyswarrm:/app/data
    environment:
      - JELLYSWARRM_USERNAME=admin
      - JELLYSWARRM_PASSWORD=${MEDIA_JELLYSWARRM_PASSWORD}
      - TZ=Europe/Paris
    networks:
      - shared-net

  streamystats:
    image: ghcr.io/fredrikburmester/streamystats-aio:latest
    container_name: streamystats
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - TZ=Europe/Paris
      - POSTGRES_USER=${MEDIA_STREAMYSTATS_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${MEDIA_STREAMYSTATS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${MEDIA_STREAMYSTATS_POSTGRES_DB:-streamystats}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - DATABASE_URL=postgresql://${MEDIA_STREAMYSTATS_POSTGRES_USER:-postgres}:${MEDIA_STREAMYSTATS_POSTGRES_PASSWORD}@localhost:5432/${MEDIA_STREAMYSTATS_POSTGRES_DB:-streamystats}
      - SESSION_SECRET=${MEDIA_STREAMYSTATS_SESSION_SECRET}
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${MEDIA_STREAMYSTATS_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      - NODE_ENV=production
    volumes:
      - /mnt/storage/Docker/media/streamystats/data:/var/lib/postgresql/data
    networks:
      - shared-net

  rustatio:
    image: ghcr.io/takitsu21/rustatio:latest
    container_name: rustatio
    restart: unless-stopped
    network_mode: "service:proxy_0"
    depends_on:
      proxy_0:
        condition: service_healthy
    environment:
      - PORT=8080
      - TZ=Europe/Paris
      - RUST_LOG=info
      - VPN_PORT_SYNC=on
      - PUID=1001
      - PGID=1001
      - AUTH_TOKEN=${MEDIA_RUSTATIO_AUTH_TOKEN}
    volumes:
      - /mnt/storage/Docker/media/rustatio/data:/data
      - /mnt/storage/Docker/media/rustatio/torrents:/torrents

  proxy_1:
    image: qmcgaw/gluetun
    container_name: proxy_1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8089:8888"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom1.ovpn
      - OPENVPN_USER=${MEDIA_OPENVPN_USER}
      - OPENVPN_PASSWORD=${MEDIA_OPENVPN_PASSWORD}
      - TZ=Europe/Paris
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - HTTPPROXY=on
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12,10.0.0.0/24
      - FIREWALL_INPUT_PORTS=8888
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
    volumes:
      - /mnt/storage/Docker/proxy/proxy_1:/gluetun
      - ../proxy/custom1.ovpn:/gluetun/custom1.ovpn
    networks:
      - shared-net

networks:
  shared-net:
    external: true